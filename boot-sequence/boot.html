<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MYTY Boot Sequence</title>
<style>
  @font-face { font-family: "Px437"; src: url("fonts/px437.woff2") format("woff2"); }
  @font-face { font-family: "VCR"; src: url("fonts/vcr.woff2") format("woff2"); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; height: auto; max-width: 1920px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="lottie.min.js"></script>
<script src="logo.js"></script>
<script>
// MYTY boot sequence: firmware POST -> blue logo boot -> lock screen -> sign-in.
// Everything is a pure function of time t (seconds) so it can be rendered frame by frame.
const W = 1920, H = 1080, FPS = 30, DURATION = 31;
const BLUE = "#0a0192", WHITE = "#ffffff", BLACK = "#000000";
const FONT = "Px437", FONT2 = "VCR";

const c = document.getElementById("c");
const ctx = c.getContext("2d");

function mk(w, h) { const k = document.createElement("canvas"); k.width = w; k.height = h; return k; }

// ---- timeline -----------------------------------------------------------
const T = {
  post: 0.9, postEnd: 6.6,      // 90s BIOS banner + memory test + drive detection
  grid: 6.8, gridEnd: 12.2,     // system configuration grid + PCI listing
  blue: 12.6, logo: 12.9,       // blue boot screen, Lottie starts
  spin: 16.2,                   // spinner under the finished logo
  lock: 19.2,                   // logo jump grows into the lock screen
  login: 23.4, loginIn: 0.8,    // lock screen lifts away
  type: 24.8, enter: 26.3, welcome: 26.6,
  out: 29.4, outLen: 1.2,
};
const CUTS = [T.post, T.postEnd, T.grid, T.gridEnd, T.blue, T.login, T.welcome, T.out];

// ---- helpers ------------------------------------------------------------
function rng(seed) { let s = (seed * 2654435761) >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

// MYTY mark: rounded square with a 2x2 grid of round holes.
function logoPath(g, cx, cy, s, hf = 1) {
  const r = s * 0.2, x = cx - s / 2, y = cy - s / 2;
  g.beginPath();
  g.roundRect(x, y, s, s, r);
  const hr = s * 0.18 * hf, off = s * 0.215;
  if (hr < 0.5) return;
  for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { g.moveTo(cx + dx * off + hr, cy + dy * off); g.arc(cx + dx * off, cy + dy * off, hr, 0, Math.PI * 2); }
}
function text(g, s, x, y, size, color = WHITE, font = FONT, align = "left") {
  g.font = `${size}px "${font}"`; g.fillStyle = color; g.textAlign = align; g.textBaseline = "top"; g.fillText(s, x, y);
}

// 1-bit pixel icons
const ICONS = {
  wifi: ["....XXXXX....", "..XX.....XX..", ".X..XXXXX..X.", "...X.....X...", ".....XXX.....", "......X......"],
  power: ["....X....", "..X.X.X..", ".X..X..X.", "X...X...X", "X.......X", ".X.....X.", "..XXXXX.."],
  access: ["...XX...", "...XX...", "XXXXXXXX", "...XX...", "...XX...", "..X..X..", ".X....X."],
  battery: ["XXXXXXXXXXX.", "X.XXXXXXX.XX", "X.XXXXXXX.XX", "XXXXXXXXXXX."],
  arrow: ["...X...", "....X..", "XXXXXX.", "....X..", "...X..."],
};
function icon(g, name, x, y, px, color = WHITE) {
  g.fillStyle = color;
  ICONS[name].forEach((row, j) => [...row].forEach((ch, i) => { if (ch === "X") g.fillRect(x + i * px, y + j * px, px, px); }));
}

// Windows-style chasing dots, drawn as hard pixel squares.
function spinner(g, cx, cy, t, r = 30, px = 7, color = WHITE) {
  const period = 2.4;
  for (let i = 0; i < 6; i++) {
    const u = ((t - i * 0.11) % period + period) % period / period;
    if (u > 0.82) continue; // gap between laps, like the real spinner
    const k = u / 0.82, a = -Math.PI / 2 + Math.PI * 2 * (k - Math.sin(Math.PI * 2 * k) * 0.13) * 1.25;
    g.fillStyle = color;
    g.fillRect(Math.round(cx + Math.cos(a) * r - px / 2), Math.round(cy + Math.sin(a) * r - px / 2), px, px);
  }
}

// ---- Lottie logo ------------------------------------------------------------
// Rendered with lottie's SVG renderer (same as the live site), each frame cached as a bitmap.
const logoFrames = [];
const logoReady = (async () => {
  const holder = document.createElement("div");
  holder.style.cssText = "position:absolute;left:-10000px;top:0;width:1920px;height:1080px;";
  document.body.appendChild(holder);
  const anim = lottie.loadAnimation({ container: holder, renderer: "svg", loop: false, autoplay: false, animationData: window.LOGO_DATA,
    rendererSettings: { preserveAspectRatio: "xMidYMid meet" } });
  await new Promise(r => anim.addEventListener("DOMLoaded", r));
  const svg = holder.querySelector("svg");
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  for (let f = 0; f < anim.totalFrames; f++) {
    anim.goToAndStop(f, true);
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: "image/svg+xml" }));
    const img = new Image(); img.src = url; await img.decode();
    logoFrames.push(await createImageBitmap(img, { resizeWidth: W, resizeHeight: H })); URL.revokeObjectURL(url);
  }
  holder.remove();
})();
function drawLogo(g, t) {
  g.drawImage(logoFrames[Math.floor(clamp((t - T.logo) * 24, 0, logoFrames.length - 1))], 0, 0);
}

// ---- scenes ------------------------------------------------------------
function sceneCRT(g, t) {
  g.fillStyle = BLACK; g.fillRect(0, 0, W, H);
  const k = clamp((t - 0.25) / 0.45);
  if (k <= 0 || k >= 1) return;
  const w = W * Math.sin(k * Math.PI), h = 4 + 30 * Math.pow(Math.sin(k * Math.PI), 6);
  const gr = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, w / 2);
  gr.addColorStop(0, "#fff"); gr.addColorStop(0.6, "rgba(77,124,255,0.8)"); gr.addColorStop(1, "rgba(77,124,255,0)");
  g.fillStyle = gr; g.fillRect(W / 2 - w / 2, H / 2 - h / 2, w, h);
}

// 90s BIOS look: 80x25 text mode feel, big Px437 type.
const LH = 37, FS = 28, X0 = 90;
function scanlines(g) { g.fillStyle = "rgba(0,0,0,0.22)"; for (let j = 0; j < H; j += 4) g.fillRect(0, j, W, 2); }
function typed(line, t, at, speed = 0.15) { return line.slice(0, Math.ceil(clamp((t - at) / speed) * line.length)); }

// Replaces the "Energy Star" badge: swoosh over the MYTY mark.
function powerBadge(g, x, y) {
  g.save(); g.translate(x, y);
  g.lineWidth = 14; g.lineCap = "round";
  const gr = g.createLinearGradient(20, 0, 340, 0); gr.addColorStop(0, "#2b45ff"); gr.addColorStop(1, "#ffffff");
  g.strokeStyle = gr; g.beginPath(); g.arc(170, 165, 135, Math.PI * 1.08, Math.PI * 1.9); g.stroke();
  // mark with solid black holes so the swoosh doesn't show through
  g.fillStyle = BLACK; g.beginPath(); g.roundRect(296 - 35, 116 - 35, 70, 70, 14); g.fill();
  logoPath(g, 296, 116, 66); g.fillStyle = WHITE; g.fill("evenodd");
  g.restore();
  text(g, "myty", x + 66, y + 104, 52, WHITE, FONT2);
  text(g, "MODULAR POWER ALLY", x + 170, y + 182, 19, "#7f95ff", FONT, "center");
}

const BIOS_LINES = [
  [0.0, "#MYTY Modular BIOS v4.51MY, A Low Power Ally"],
  [0.0, "#Copyright (C) 1997-2026, MYTY Systems, Ltd."],
  [0.0, ""],
  [0.3, "(MYTX97E) MYTY M430VX PCIset(TM)"],
  [0.3, ""],
  [0.6, "MYTY-X CPU at 75MHz"],
  [0.8, "MEMTEST"],
  [2.6, ""],
  [2.7, "MYTY Plug and Play BIOS Extension  v1.0A"],
  [2.7, "Copyright (C) 1997, MYTY Systems, Ltd."],
  [3.1, "IDE0"], [3.85, "IDE1"], [4.45, "IDE2"], [4.9, "IDE3"],
];
const IDE = [["Primary Master", "MYTY-HD 2048"], ["Primary Slave", "MYTY-CD 24X"], ["Secondary Master", "None"], ["Secondary Slave", "None"]];

function scenePOST(g, t) {
  g.fillStyle = BLACK; g.fillRect(0, 0, W, H);
  let y = 70;
  for (const [at, line] of BIOS_LINES) {
    if (t < at) break;
    if (line.startsWith("#")) { // ribbon line: MYTY mark instead of the Award ribbon
      if (y === 70) { g.save(); logoPath(g, X0 + 13, y + 14, 27); g.fillStyle = "#4d7cff"; g.fill("evenodd"); g.restore(); }
      text(g, line.slice(1), X0 + 40, y, FS);
    } else if (line === "MEMTEST") {
      const k = clamp((t - at) / 1.6), kb = Math.floor(k * 32768 / 4) * 4;
      text(g, "Memory Test :  " + String(kb).padStart(5, " ") + "K" + (k >= 1 ? " OK" : ""), X0, y, FS);
    } else if (line.startsWith("IDE")) {
      const [name, dev] = IDE[+line[3]], done = t > at + 0.45;
      text(g, "  Detecting IDE " + name.padEnd(16, " ") + " ... " + (done ? dev : "[Press F4 to skip]"), X0, y, FS, done ? WHITE : "#c8d2ff");
    } else text(g, typed(line, t, at), X0, y, FS);
    y += LH;
  }
  if (Math.floor(t * 3) % 2 === 0) { g.fillStyle = WHITE; g.fillRect(X0 + 4, y + 26, 20, 5); }
  powerBadge(g, W - 440, 50);
  // "DEL" highlighted like the original
  g.font = `${FS}px "${FONT}"`; const pw = g.measureText("Press ").width, dw = g.measureText("DEL").width;
  text(g, "Press ", X0, H - 120, FS); text(g, "DEL", X0 + pw, H - 120, FS, "#7f95ff"); text(g, " to enter SETUP", X0 + pw + dw, H - 120, FS);
  text(g, "10/06/97-M430VX,MYTY8669-2A59GH2BC-00", X0, H - 83, FS, "#9fb2ff");
  scanlines(g);
}

// Rounded double-line box, drawn on progressively (p 0..1) like a BIOS table filling in.
function roundedGrid(g, x, y, w, h, p, title) {
  const r = 22;
  g.save(); g.strokeStyle = WHITE; g.lineWidth = 3;
  const len = 2 * (w + h);
  g.setLineDash([len * p, len]);
  g.beginPath(); g.roundRect(x, y, w, h, r); g.stroke();
  g.beginPath(); g.roundRect(x + 9, y + 9, w - 18, h - 18, r - 8); g.stroke();
  g.restore();
  if (title && p > 0.3) {
    g.font = `${FS}px "${FONT}"`; const tw = g.measureText(title).width + 40;
    g.fillStyle = BLACK; g.beginPath(); g.roundRect(x + w / 2 - tw / 2, y - 20, tw, 40, 20); g.fill();
    g.strokeStyle = WHITE; g.lineWidth = 3; g.stroke();
    text(g, title, x + w / 2, y - 12, FS, WHITE, FONT, "center");
  }
}

const CFG_TOP = [
  ["CPU Type", "MYTY-X", "Base Memory", "640K"],
  ["Co-Processor", "Installed", "Extended Memory", "31744K"],
  ["CPU Clock", "75MHz", "Cache Memory", "256K"],
];
const CFG_BOT = [
  ["Diskette Drive A", "1.44M, 3.5 in.", "Display Type", "EGA/VGA"],
  ["Diskette Drive B", "None", "Serial Port(s)", "3F8 2F8"],
  ["Pri. Master Disk", "LBA,Mode 4,2048MB", "Parallel Port(s)", "378"],
  ["Pri. Slave Disk", "CDROM,Mode 4", "EDO DRAM at Row(s)", "0 1 2 3"],
  ["Sec. Master Disk", "None", "SDRAM at Row(s)", "None"],
  ["Sec. Slave Disk", "None", "L2 Cache Type", "Pipeline Burst"],
];
const PCI = [
  ["0", "7", "1", "4D59", "1230", "IDE Controller", "14"],
  ["0", "7", "2", "4D59", "7020", "Serial bus controller", "10"],
  ["0", "17", "0", "4D59", "0005", "Network controller", "11"],
  ["0", "19", "0", "4D59", "8811", "Display controller", "NA"],
];

function sceneGrid(g, t) {
  g.fillStyle = BLACK; g.fillRect(0, 0, W, H);
  text(g, "MYTY Systems, Ltd. (C) 1997-2026", W / 2, 40, FS, WHITE, FONT, "center");
  const gx = 150, gy = 110, gw = W - 300, gh = 420, p = ease(clamp(t / 0.6));
  roundedGrid(g, gx, gy, gw, gh, p, "System Configurations");
  if (p >= 1) {
    const colA = gx + 60, colB = gx + gw / 2 + 40, row = (r) => gy + 40 + r * LH;
    const cell = (cells, r) => {
      const [k1, v1, k2, v2] = cells;
      text(g, k1.padEnd(17, " ") + ": " + v1, colA, row(r), FS);
      text(g, k2.padEnd(19, " ") + ": " + v2, colB, row(r), FS);
    };
    CFG_TOP.forEach((c, i) => cell(c, i));
    // rounded divider
    g.fillStyle = WHITE; g.beginPath(); g.roundRect(gx + 30, row(3) + 6, gw - 60, 3, 2); g.fill();
    CFG_BOT.forEach((c, i) => cell(c, i + 3.4));
    g.beginPath(); g.roundRect(gx + gw / 2, gy + 30, 3, gh - 60, 2); g.fill(); // centre column rule
  }
  // PCI device listing, rows arriving one by one
  let y = gy + gh + 40;
  if (t > 1.0) {
    text(g, typed("PCI device listing.....", t, 1.0, 0.25), gx, y, FS); y += LH;
  }
  if (t > 1.3) {
    const pw = gw, ph = LH * 6 + 20, q = ease(clamp((t - 1.3) / 0.4));
    roundedGrid(g, gx, y, pw, ph, q, null);
    if (q >= 1) {
      const cols = [0, 140, 290, 430, 580, 730, 1460].map(c => gx + 40 + c);
      ["Bus No.", "Device No.", "Func No.", "Vendor ID", "Device ID", "Device Class", "IRQ"].forEach((h, i) => text(g, h, cols[i], y + 20, FS, "#9fb2ff"));
      g.fillStyle = WHITE; g.beginPath(); g.roundRect(gx + 30, y + 20 + LH, pw - 60, 3, 2); g.fill();
      PCI.forEach((r, j) => { if (t > 1.9 + j * 0.3) r.forEach((v, i) => text(g, v, cols[i], y + 30 + LH * (j + 1), FS)); });
    }
    y += ph + 24;
  }
  if (t > 3.4) {
    const dots = ".".repeat(Math.min(20, Math.floor((t - 3.4) / 0.04)));
    text(g, "Verifying DMI Pool Data " + dots, gx, y, FS); y += LH;
  }
  if (t > 4.4) text(g, "Booting from Windows Boot Manager" + ".".repeat(Math.min(3, Math.floor((t - 4.4) / 0.25))), gx, y, FS);
  if (Math.floor(t * 3) % 2 === 0) { g.fillStyle = WHITE; g.fillRect(gx, y + LH + 26, 20, 5); }
  scanlines(g);
}

// Final logo geometry measured from the last Lottie frame.
const LOGO = { cx: 959.5, cy: 539, s: 106 };
const JUMP = 1.15; // seconds before T.lock the jump starts

function sceneBlue(g, t) {
  g.fillStyle = BLUE; g.fillRect(0, 0, W, H);
  const u = t - (T.lock - JUMP);
  if (u < 0) {
    drawLogo(g, t);
    if (t >= T.spin) spinner(g, W / 2, 820, t - T.spin);
    return;
  }
  const bottom = LOGO.cy + LOGO.s / 2;
  let sx = 1, sy = 1, lift = 0, grow = 1, hf = 1, reveal = 0;
  if (u < 0.18) {                       // anticipation squash
    const q = Math.sin(Math.PI * u / 0.18);
    sx = 1 + 0.18 * q; sy = 1 - 0.24 * q;
  } else if (u < 0.52) {                // jump up, stretched
    const k = (u - 0.18) / 0.34;
    lift = 190 * (1 - Math.pow(1 - k, 3));
    sx = 1 - 0.08 * (1 - k); sy = 1 + 0.14 * (1 - k);
  } else {                              // fall back down while growing into the next screen
    const k = clamp((u - 0.52) / (JUMP - 0.52));
    lift = 190 * (1 - k * k);
    grow = Math.exp(Math.log(32) * Math.pow(k, 2.6));
    hf = 1 - Math.pow(k, 1.6);
    reveal = k;
  }
  g.save();
  if (reveal > 0) {
    // centred on the logo, growing past the screen edges as it comes back down; holes close up
    logoPath(g, LOGO.cx, LOGO.cy - lift, LOGO.s * grow, hf);
    g.save(); g.clip("evenodd");
    const bc = bufB.getContext("2d"); bc.clearRect(0, 0, W, H); sceneLock(bc, t - T.lock);
    g.drawImage(bufB, 0, 0);
    g.fillStyle = `rgba(255,255,255,${clamp(1 - reveal * 2.5)})`; g.fillRect(0, 0, W, H); // white logo melts into the page
    g.restore();
    g.globalAlpha = 1 - reveal; g.lineWidth = 4; g.strokeStyle = WHITE; g.stroke();
  } else {
    // squash and stretch anchored at the logo's base
    g.translate(LOGO.cx, bottom - lift); g.scale(sx, sy);
    logoPath(g, 0, -LOGO.s / 2, LOGO.s); g.fillStyle = WHITE; g.fill("evenodd");
  }
  g.restore();
}

// wallpaper gradient (shared by lock screen and sign-in)
function wallpaper(g, t, dim) {
  g.fillStyle = "#03002e"; g.fillRect(0, 0, W, H);
  const drift = Math.sin(t * 0.25) * 40;
  const blobs = [[W * 0.72 + drift, H * 0.62, 820, "rgba(77,110,255,0.95)"], [W * 0.22, H * 0.25 - drift, 680, "rgba(10,1,146,1)"], [W * 0.5, H * 1.05, 720, "rgba(200,212,255,0.7)"]];
  for (const [x, y, r, col] of blobs) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
  if (dim) { g.fillStyle = "rgba(2,0,30,0.5)"; g.fillRect(0, 0, W, H); }
}

function sceneLock(g, t) {
  wallpaper(g, t, false);
  text(g, "09:41", W / 2, 190, 150, WHITE, FONT, "center");
  text(g, "TUESDAY, OCTOBER 6", W / 2, 362, 32, WHITE, FONT2, "center");
  icon(g, "wifi", W - 230, H - 82, 4); icon(g, "battery", W - 150, H - 78, 4);
  if (Math.floor(t * 1.5) % 2 === 0) text(g, "PRESS ANY KEY TO UNLOCK", W / 2, H - 108, 20, WHITE, FONT, "center");
}

function sceneLogin(g, t) {
  wallpaper(g, t, true);
  const cy = 360;
  // avatar
  const ag = g.createLinearGradient(W / 2 - 115, cy - 115, W / 2 + 115, cy + 115); ag.addColorStop(0, "#9fb2ff"); ag.addColorStop(1, BLUE);
  g.beginPath(); g.arc(W / 2, cy, 110, 0, Math.PI * 2); g.fillStyle = ag; g.fill();
  g.save(); logoPath(g, W / 2, cy, 92); g.fillStyle = WHITE; g.fill("evenodd"); g.restore();
  text(g, "MYTY", W / 2, cy + 140, 46, WHITE, FONT2, "center");

  const by = cy + 220;
  if (t < T.welcome) {
    // password box
    g.fillStyle = "rgba(0,0,0,0.55)"; g.fillRect(W / 2 - 220, by, 440, 60);
    g.strokeStyle = WHITE; g.lineWidth = 3; g.strokeRect(W / 2 - 220, by, 440, 60);
    const n = clamp(Math.floor((t - T.type) / 0.16), 0, 9);
    if (n === 0) text(g, "PASSWORD", W / 2 - 200, by + 20, 22, "#9fb2ff");
    for (let i = 0; i < n; i++) { g.fillStyle = WHITE; g.fillRect(W / 2 - 196 + i * 26, by + 24, 12, 12); }
    if (t > T.type - 0.4 && Math.floor(t * 2.5) % 2 === 0) { g.fillStyle = WHITE; g.fillRect(W / 2 - 198 + n * 26, by + 16, 4, 28); }
    const pressed = t >= T.enter;
    g.fillStyle = pressed ? WHITE : "rgba(255,255,255,0.15)"; g.fillRect(W / 2 + 162, by + 6, 48, 48);
    icon(g, "arrow", W / 2 + 172, by + 20, 4, pressed ? BLUE : WHITE);
    text(g, "Sign-in options", W / 2, by + 88, 20, "#c8d2ff", FONT, "center");
  } else {
    spinner(g, W / 2 - 120, by + 28, t - T.welcome, 22, 6);
    text(g, "WELCOME", W / 2 - 70, by + 10, 40, WHITE, FONT2);
  }
  // bottom-left user switcher, bottom-right system icons
  g.save(); logoPath(g, 92, H - 92, 56); g.fillStyle = WHITE; g.fill("evenodd"); g.restore();
  text(g, "MYTY", 140, H - 104, 24, WHITE, FONT2);
  icon(g, "wifi", W - 260, H - 80, 4); icon(g, "access", W - 180, H - 84, 4); icon(g, "power", W - 104, H - 86, 4);
}

// ---- transitions & post effects -----------------------------------------
const bufA = mk(W, H), bufB = mk(W, H);

function glitch(g, t, amount, seed) {
  if (amount <= 0) return;
  const r = rng(seed), ac = bufA.getContext("2d");
  ac.clearRect(0, 0, W, H); ac.drawImage(c, 0, 0);
  const n = Math.floor(4 + amount * 14);
  for (let i = 0; i < n; i++) {
    const y = Math.floor(r() * H), h = Math.floor(6 + r() * 70 * amount), dx = Math.floor((r() - 0.5) * 260 * amount);
    g.drawImage(bufA, 0, y, W, h, dx, y, W, h);
    if (r() < 0.35 * amount) { // ASCII noise strip
      g.fillStyle = r() < 0.5 ? WHITE : "#4d7cff"; g.font = `${Math.max(16, h)}px "${FONT}"`; g.textBaseline = "top";
      const set = "░▒▓█/\\|-_#@"; let s = ""; for (let k = 0; k < 90; k++) s += set[Math.floor(r() * set.length)];
      g.fillText(s, Math.floor(r() * 400) - 200, y);
    }
  }
}

// ---- master render --------------------------------------------------------
function renderAt(t) {
  const g = ctx;
  g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
  if (t < T.post) sceneCRT(g, t);
  else if (t < T.postEnd) scenePOST(g, t - T.post);
  else if (t < T.grid) { g.fillStyle = BLACK; g.fillRect(0, 0, W, H); }
  else if (t < T.gridEnd) sceneGrid(g, t - T.grid);
  else if (t < T.blue) { g.fillStyle = BLACK; g.fillRect(0, 0, W, H); }
  else if (t < T.lock) sceneBlue(g, t);
  else if (t < T.login) sceneLock(g, t - T.lock);
  else if (t < T.login + T.loginIn) {
    const p = ease((t - T.login) / T.loginIn);
    sceneLogin(g, t);
    const bc = bufB.getContext("2d"); bc.clearRect(0, 0, W, H); sceneLock(bc, t - T.lock);
    g.drawImage(bufB, 0, -p * H); // lock screen lifts up and away
  }
  else if (t < T.out) sceneLogin(g, t);
  else { sceneLogin(g, t); g.fillStyle = `rgba(0,0,0,${ease(clamp((t - T.out) / T.outLen))})`; g.fillRect(0, 0, W, H); }

  // glitch bursts on every cut, plus a couple of tiny ones during POST (never over the logo itself)
  let amt = 0;
  for (const ct of CUTS) { const d = t - ct; if (d >= -0.07 && d < 0.3) amt = Math.max(amt, 1 - Math.max(0, d) / 0.3); }
  for (const ct of [T.post + 2.3, T.post + 4.2, T.grid + 2.6]) { const d = t - ct; if (d >= 0 && d < 0.1) amt = Math.max(amt, 0.35); }
  if (t > T.blue + 0.3 && t < T.lock + 0.3) amt = 0; // keep the logo and its jump clean
  glitch(g, t, amt, Math.floor(t * FPS) + 7);
}

window.BOOT = { W, H, FPS, DURATION, renderAt, ready: Promise.all([logoReady, document.fonts.load(`28px "${FONT}"`), document.fonts.load(`28px "${FONT2}"`)]) };

// live preview: plays in real time when opened in a browser (?still disables it)
if (!location.search.includes("still")) BOOT.ready.then(() => {
  const t0 = performance.now();
  const loop = () => { renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  loop();
});
</script>
</body>
</html>
