<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MYTY Boot Sequence</title>
<style>
  @font-face { font-family: "Px437"; src: url("fonts/px437.woff2") format("woff2"); }
  @font-face { font-family: "VCR"; src: url("fonts/vcr.woff2") format("woff2"); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; height: auto; max-width: 1920px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="lottie.min.js"></script>
<script src="logo.js"></script>
<script>
// MYTY boot sequence: firmware POST -> blue logo boot -> lock screen -> sign-in.
// Everything is a pure function of time t (seconds) so it can be rendered frame by frame.
const W = 1920, H = 1080, FPS = 30, DURATION = 16;
const BLUE = "#0a0192", WHITE = "#ffffff", BLACK = "#000000";
const FONT = "Px437", FONT2 = "VCR";

const c = document.getElementById("c");
const ctx = c.getContext("2d");

function mk(w, h) { const k = document.createElement("canvas"); k.width = w; k.height = h; return k; }

// ---- timeline -----------------------------------------------------------
const T = {
  term: 0.4, termEnd: 7.3,                       // sci-fi terminal: system -> kernel -> boot
  blue: 7.5, logo: 7.75,                         // blue boot screen, Lottie starts
  spin: 7.75 + 73 / 24,                          // spinner starts the moment the logo animation ends
  impact: 7.75 + 73 / 24 + 2.2,                  // logo jumps, slams back to centre; end screen starts here
};

// ---- helpers ------------------------------------------------------------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

// MYTY mark: rounded square with a 2x2 grid of round holes.
function logoPath(g, cx, cy, s, hf = 1) {
  const r = s * 0.2, x = cx - s / 2, y = cy - s / 2;
  g.beginPath();
  g.roundRect(x, y, s, s, r);
  const hr = s * 0.18 * hf, off = s * 0.215;
  if (hr < 0.5) return;
  for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { g.moveTo(cx + dx * off + hr, cy + dy * off); g.arc(cx + dx * off, cy + dy * off, hr, 0, Math.PI * 2); }
}
function text(g, s, x, y, size, color = WHITE, font = FONT, align = "left") {
  g.font = `${size}px "${font}"`; g.fillStyle = color; g.textAlign = align; g.textBaseline = "top"; g.fillText(s, x, y);
}

// 1-bit pixel icons
const ICONS = {
  wifi: ["....XXXXX....", "..XX.....XX..", ".X..XXXXX..X.", "...X.....X...", ".....XXX.....", "......X......"],
  battery: ["XXXXXXXXXXX.", "X.XXXXXXX.XX", "X.XXXXXXX.XX", "XXXXXXXXXXX."],
};
function icon(g, name, x, y, px, color = WHITE) {
  g.fillStyle = color;
  ICONS[name].forEach((row, j) => [...row].forEach((ch, i) => { if (ch === "X") g.fillRect(x + i * px, y + j * px, px, px); }));
}

// Windows-style chasing dots, drawn as hard pixel squares.
function spinner(g, cx, cy, t, r = 30, px = 7, color = WHITE) {
  const period = 1.7;
  for (let i = 0; i < 6; i++) {
    const u = ((t - i * 0.08) % period + period) % period / period;
    if (u > 0.82) continue; // gap between laps, like the real spinner
    const k = u / 0.82, a = -Math.PI / 2 + Math.PI * 2 * (k - Math.sin(Math.PI * 2 * k) * 0.13) * 1.25;
    g.fillStyle = color;
    g.fillRect(Math.round(cx + Math.cos(a) * r - px / 2), Math.round(cy + Math.sin(a) * r - px / 2), px, px);
  }
}

// ---- Lottie logo ------------------------------------------------------------
// Rendered with lottie's SVG renderer (same as the live site), each frame cached as a bitmap.
const logoFrames = [];
const logoReady = (async () => {
  const holder = document.createElement("div");
  holder.style.cssText = "position:absolute;left:-10000px;top:0;width:1920px;height:1080px;";
  document.body.appendChild(holder);
  const anim = lottie.loadAnimation({ container: holder, renderer: "svg", loop: false, autoplay: false, animationData: window.LOGO_DATA,
    rendererSettings: { preserveAspectRatio: "xMidYMid meet" } });
  await new Promise(r => anim.addEventListener("DOMLoaded", r));
  const svg = holder.querySelector("svg");
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  for (let f = 0; f < anim.totalFrames; f++) {
    anim.goToAndStop(f, true);
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: "image/svg+xml" }));
    const img = new Image(); img.src = url; await img.decode();
    logoFrames.push(await createImageBitmap(img, { resizeWidth: W, resizeHeight: H })); URL.revokeObjectURL(url);
  }
  holder.remove();
})();
function drawLogo(g, t) {
  g.drawImage(logoFrames[Math.floor(clamp((t - T.logo) * 24, 0, logoFrames.length - 1))], 0, 0);
}

// ---- scenes ------------------------------------------------------------
function sceneBlack(g) { g.fillStyle = BLACK; g.fillRect(0, 0, W, H); }

// ---- sci-fi terminal (replaces the BIOS screens) ---------------------------
// One evolving screen: ASCII mark + header, tabbed content (SYSTEM -> KERNEL -> BOOT),
// a SYSTEM CONFIGURATIONS panel and a BUS LOGGER panel. `t` is seconds since it appeared.
const FG = "#d6d9e4", DIM = "#6c7186", ACC = "#4d7cff";
const TS = 20, TL = 27;            // terminal type size and line height
function scanlines(g) { g.fillStyle = "rgba(0,0,0,0.22)"; for (let j = 0; j < H; j += 4) g.fillRect(0, j, W, 2); }
function typed(line, t, at, speed = 0.15) { return line.slice(0, Math.ceil(clamp((t - at) / speed) * line.length)); }
function rng(seed) { let v = (seed * 2654435761) >>> 0; return () => ((v = (v * 1664525 + 1013904223) >>> 0) / 4294967296); }

// MYTY mark as block-character art, sampled from the vector mark.
const ASCII_MARK = (() => {
  const cols = 26, rows = 13, k = mk(260, 260), kc = k.getContext("2d"), out = [];
  logoPath(kc, 130, 130, 250);
  for (let j = 0; j < rows; j++) {
    let row = "";
    for (let i = 0; i < cols; i++) row += kc.isPointInPath((i + 0.5) * 260 / cols, (j + 0.5) * 260 / rows, "evenodd") ? "▒" : " ";
    out.push(row);
  }
  return out;
})();

// thin double frame with small rounded corners, drawn on progressively (p 0..1)
function frame(g, x, y, w, h, p, title) {
  g.save(); g.strokeStyle = FG; g.lineWidth = 1.5;
  const len = 2 * (w + h); g.setLineDash([len * p, len]);
  g.beginPath(); g.roundRect(x, y, w, h, 8); g.stroke();
  g.strokeStyle = DIM; g.beginPath(); g.roundRect(x + 6, y + 6, w - 12, h - 12, 5); g.stroke();
  g.restore();
  if (title && p > 0.5) { text(g, title, x + 22, y + 20, TS, FG); text(g, "v", x + w - 30, y + 20, TS, DIM); }
}
function leader(key, width) { return (key + " ").padEnd(width, "."); }

const SPECS = [
  ["CPU", "AMD RYZEN 9 9900X3D", "12 CORES / 24 THREADS @ 4400MHZ"],
  ["GPU", "NVIDIA RTX 5090 FE", "32768MB GDDR7"],
  ["CHIPSET", "MYTY X870E PCISET(TM)", "MYTX870E"],
  ["MEMORY TEST", "MEM", ""],
  ["CACHE MEMORY", "131072K", "L2: PIPELINE BURST"],
  ["PLUG AND PLAY EXT", "V1.0A", "(C) 1997 MYTY SYSTEMS, LTD."],
  ["IDE PRIMARY MASTER", "MYTY-HD 2048", "LBA, MODE 4, 2048MB"],
  ["IDE PRIMARY SLAVE", "MYTY-CD 24X", "CDROM, MODE 4"],
  ["IDE SECONDARY MASTER", "NONE", ""],
  ["IDE SECONDARY SLAVE", "NONE", ""],
];
const MODULES = ["WINLOAD.EFI", "NTOSKRNL.EXE", "HAL.DLL", "KDCOM.DLL", "CI.DLL", "CLFS.SYS", "TPM.SYS", "ACPI.SYS", "PCI.SYS", "STORNVME.SYS", "AMDPPM.SYS", "NVLDDMKM.SYS"];
const CONFIG = [
  ["BASE MEMORY", "640K"], ["EXTENDED MEMORY", "31744K"], ["CO-PROCESSOR", "12C / 24T"], ["CPU CLOCK", "4400MHZ"],
  ["DISKETTE DRIVE A", "1.44M, 3.5 IN."], ["DISKETTE DRIVE B", "NONE"], ["DISPLAY TYPE", "RTX 5090 FE"], ["SERIAL PORT(S)", "3F8 2F8"],
  ["PARALLEL PORT(S)", "378"], ["EDO DRAM AT ROW(S)", "0 1 2 3"], ["SDRAM AT ROW(S)", "NONE"], ["L2 CACHE TYPE", "PIPELINE BURST"],
];
const BUSLOG = [
  "POST  CPU0 MICROCODE OK", "MEM   0x0000_0000 > 0x0009_FFFF OK", "MEM   0x0010_0000 > 0x01FF_FFFF OK",
  "PCI   0:07:1 4D59:1230 IDE CTRL  IRQ14", "PCI   0:07:2 4D59:7020 SERIAL BUS IRQ10", "PCI   0:17:0 4D59:0005 NETWORK   IRQ11",
  "PCI   1:00:0 10DE:2B85 DISPLAY   IRQNA", "IDE0  MYTY-HD 2048 LBA MODE4", "IDE1  MYTY-CD 24X CDROM MODE4", "IDE2  NONE", "IDE3  NONE",
  "USB   1 KBD / 1 MOUSE / 2 HUB", "TPM   2.0 READY", "SB    SECURE BOOT ENABLED", "NVRAM CHECK OK", "DMI   POOL 0x000F_0000 VERIFY",
  "DMI   POOL 0x000F_8000 VERIFY", "DMI   POOL DATA OK", "EFI   \\EFI\\MICROSOFT\\BOOT\\BOOTMGFW.EFI", "BOOT  HANDOFF > WINDOWS BOOT MANAGER",
];

function sceneTerminal(g, t) {
  g.fillStyle = BLACK; g.fillRect(0, 0, W, H);
  const X = 70;

  // ASCII mark scans in row by row
  ASCII_MARK.forEach((row, j) => {
    const p = clamp((t - j * 0.035) / 0.12);
    if (p > 0) text(g, row.slice(0, Math.ceil(row.length * p)), X, 40 + j * 16, 16, j === Math.floor(t / 0.035) ? WHITE : FG);
  });
  text(g, typed("MYTY.TERMINAL V4.51MY - MYTY SYSTEMS 2026", t, 0.25, 0.3), X, 268, TS, FG);
  text(g, typed("NAVIGATE WITH ARROW & ENTER KEYS  //  DEL: SETUP  F11: BOOT MENU", t, 0.4, 0.3), X, 300, TS, DIM);

  // device line with a boxed status tag
  if (t > 0.55) {
    g.strokeStyle = FG; g.lineWidth = 1.5; g.strokeRect(X, 342, 16, 16);
    g.fillStyle = ACC; g.beginPath(); g.arc(X + 34, 350, 5, 0, Math.PI * 2); g.fill();
    const dl = "M-001 - X870E-MYTY9900 - MODULAR BIOS V4.51MY";
    text(g, dl, X + 50, 340, TS, FG);
    g.font = `${TS}px "${FONT}"`; const tx = X + 50 + g.measureText(dl).width + 16, tag = "A LOW POWER ALLY - ACTIVE";
    const tw = g.measureText(tag).width + 16; g.strokeStyle = FG; g.strokeRect(tx, 336, tw, 28); text(g, tag, tx + 8, 340, TS, FG);
  }

  // tabs; highlight moves as the boot progresses
  const tabs = ["SYSTEM", "KERNEL", "BOOT"], phase = t < 2.7 ? 0 : t < 5.0 ? 1 : 2;
  if (t > 0.7) {
    let tx = X + 50;
    g.font = `${TS}px "${FONT}"`;
    tabs.forEach((name, i) => {
      const w = g.measureText(name).width;
      if (i === phase) { g.strokeStyle = WHITE; g.lineWidth = 1.5; g.strokeRect(tx - 6, 386, w + 12, 28); }
      text(g, name, tx, 390, TS, i === phase ? WHITE : DIM);
      tx += w + 44;
    });
  }

  const cy0 = 446;
  if (phase === 0) {
    SPECS.forEach(([k, v, extra], i) => {
      const at = 0.85 + i * 0.16;
      if (t < at) return;
      const y = cy0 + i * TL;
      let val = v, ex = extra;
      if (v === "MEM") { const m = clamp((t - at) / 0.9); val = String(Math.floor(m * 32768 / 4) * 4).padStart(5, " ") + "K"; ex = m >= 1 ? "OK" : "TESTING"; }
      if (k.startsWith("IDE") && t < at + 0.25) { val = "...."; ex = "DETECTING"; }
      text(g, typed(leader(k, 30), t, at, 0.08), X + 50, y, TS, DIM);
      if (t > at + 0.08) {
        text(g, "<", X + 50 + 31 * 10, y, TS, DIM);
        text(g, val.padStart(22, " ").slice(-22), X + 50 + 33 * 10, y, TS, WHITE);
        text(g, ">", X + 50 + 56 * 10, y, TS, DIM);
        text(g, ex, X + 50 + 59 * 10, y, TS, ex === "OK" ? ACC : DIM);
      }
    });
  } else if (phase === 1) {
    const k0 = 2.75, done = MODULES.filter((_, i) => t > k0 + i * 0.18 + 0.25).length;
    text(g, leader("LOADING KERNEL", 30) + " [" + String(done).padStart(2, "0") + "/" + MODULES.length + "]", X + 50, cy0, TS, FG);
    MODULES.forEach((m, i) => {
      const at = k0 + i * 0.18;
      if (t < at) return;
      const y = cy0 + (i + 1.4) * TL, p = clamp((t - at) / 0.25), n = 24, f = Math.round(p * n);
      const addr = "0xFFFFF803`" + (0x4A200000 + i * 0x2D7000).toString(16).toUpperCase();
      text(g, addr, X + 50, y, TS, DIM);
      text(g, m.padEnd(14, " "), X + 50 + 21 * 10, y, TS, WHITE);
      text(g, "█".repeat(f) + "░".repeat(n - f), X + 50 + 36 * 10, y, TS, p >= 1 ? ACC : FG);
      text(g, p >= 1 ? "OK" : String(Math.round(p * 100)).padStart(3, " ") + "%", X + 50 + 62 * 10, y, TS, p >= 1 ? ACC : DIM);
    });
  } else {
    const b0 = 5.05, dots = clamp(Math.floor((t - b0) / 0.02), 0, 24);
    text(g, leader("VERIFYING DMI POOL DATA", 30) + " " + ".".repeat(dots) + (dots >= 24 ? " OK" : ""), X + 50, cy0, TS, dots >= 24 ? FG : DIM);
    if (t > b0 + 0.6) {
      text(g, leader("BOOT DEVICE", 30) + " < WINDOWS BOOT MANAGER >", X + 50, cy0 + TL, TS, FG);
      const p = clamp((t - b0 - 0.7) / 0.8), n = 48, f = Math.round(p * n);
      text(g, "█".repeat(f) + "░".repeat(n - f) + "  " + String(Math.round(p * 100)).padStart(3, " ") + "%", X + 50, cy0 + TL * 2.5, TS, ACC);
      if (p >= 1) text(g, "BOOTING FROM WINDOWS BOOT MANAGER" + ".".repeat(clamp(Math.floor((t - b0 - 1.5) / 0.15), 0, 3)), X + 50, cy0 + TL * 4, TS, WHITE);
    }
  }

  // firmware notice + help bar, bottom left
  if (t > 1.0) {
    const ny = 880;
    text(g, "MYTY MODULAR BIOS V4.51MY", X, ny, TS, FG);
    ["COPYRIGHT (C) 1997-2026, MYTY SYSTEMS, LTD. ALL RIGHTS RESERVED.", "LOW POWER ALLY. SETTINGS AND BEHAVIOUR MAY CHANGE BETWEEN RELEASES.", "REPORT ISSUES TO SUPPORT@MYTY.SYSTEMS"]
      .forEach((l, i) => text(g, l, X, ny + 30 + i * 26, 16, DIM));
    g.strokeStyle = FG; g.lineWidth = 1.5; g.beginPath(); g.roundRect(X, 1010, 230, 30, 4); g.stroke();
    text(g, "HELP", X + 12, 1015, TS, FG); text(g, "v", X + 206, 1015, TS, DIM);
    text(g, "10/06/97-X870E,MYTY9900-2A59GH2BC-00", X + 260, 1015, TS, DIM);
  }

  // SYSTEM CONFIGURATIONS panel with a memory map that fills during the memory test
  const PX = 1130, PW = 730;
  const p1 = ease(clamp((t - 0.6) / 0.5));
  if (p1 > 0) {
    frame(g, PX, 40, PW, 420, p1, "SYSTEM CONFIGURATIONS");
    if (p1 >= 1) {
      CONFIG.forEach(([k, v], i) => {
        if (t < 1.1 + i * 0.07) return;
        const col = i % 2, row = Math.floor(i / 2), x = PX + 30 + col * 350, y = 92 + row * TL;
        text(g, (k + " ").padEnd(19, ".") + " " + v, x, y, 16, col ? FG : FG);
      });
      // memory map: 48x6 cells
      const mx = PX + 30, my = 276, cw = 14, ch = 14, cols = 46, rows = 8, filled = Math.floor(clamp((t - 1.5) / 0.9) * cols * rows);
      text(g, "MEMORY MAP  32768K", mx, my - 4, 16, DIM);
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        const n = j * cols + i, on = n < filled;
        g.fillStyle = on ? (n === filled - 1 ? WHITE : ACC) : "#1b1e2a";
        g.fillRect(mx + i * cw, my + 20 + j * ch, cw - 3, ch - 3);
      }
    }
  }

  // BUS LOGGER panel: streaming log lines (newest on top) + plot with a moving dot
  const p2 = ease(clamp((t - 1.0) / 0.5));
  if (p2 > 0) {
    const by = 490, bh = 560;
    frame(g, PX, by, PW, bh, p2, "BUS LOGGER");
    if (p2 >= 1) {
      const shown = BUSLOG.map((l, i) => [l, 1.4 + i * 0.22]).filter(([, at]) => t >= at).reverse().slice(0, 18);
      shown.forEach(([l, at], i) => {
        const s = 2 + Math.floor(at * 7);
        text(g, `M001_09:41:${String(s).padStart(2, "0")} >`, PX + 30, by + 60 + i * 26, 14, i === 0 ? WHITE : FG);
        text(g, l.slice(0, 30), PX + 190, by + 60 + i * 26, 14, i === 0 ? WHITE : DIM);
      });
      // plot grid
      const gx = PX + 470, gy = by + 56, gw = 230, gh = 470;
      g.strokeStyle = "#3a3f52"; g.lineWidth = 1;
      for (let i = 0; i <= 6; i++) { g.beginPath(); g.moveTo(gx + i * gw / 6, gy); g.lineTo(gx + i * gw / 6, gy + gh); g.stroke(); }
      for (let j = 0; j <= 12; j++) { g.beginPath(); g.moveTo(gx, gy + j * gh / 12); g.lineTo(gx + gw, gy + j * gh / 12); g.stroke(); }
      g.strokeStyle = FG; g.strokeRect(gx, gy, gw, gh);
      for (let k = 6; k >= 0; k--) { // dot with a short trail
        const tt = t - k * 0.04, dx = gx + gw / 2 + Math.sin(tt * 2.3) * gw * 0.38, dy = gy + gh / 2 + Math.sin(tt * 1.7 + 1) * gh * 0.4;
        g.fillStyle = k ? `rgba(214,217,228,${0.12 * (6 - k)})` : WHITE; g.fillRect(dx - 3, dy - 3, 6, 6);
      }
      const dxv = Math.round(1900 + Math.sin(t * 2.3) * 400), dyv = Math.round(520 + Math.sin(t * 1.7 + 1) * 300);
      text(g, `X: ${dxv}  Y: ${dyv}`, gx, gy + gh + 4, 14, DIM);
    }
  }
  scanlines(g);
}

// Final logo geometry measured from the last Lottie frame.
const LOGO = { cx: 959.5, cy: 539, s: 106 };
const JUMP = 0.42; // seconds before T.impact the jump starts
const LIFT = 210;

function markAt(g, lift) {
  logoPath(g, LOGO.cx, LOGO.cy - lift, LOGO.s); g.fillStyle = WHITE; g.fill("evenodd");
}

function sceneBlue(g, t) {
  g.fillStyle = BLUE; g.fillRect(0, 0, W, H);
  const u = t - (T.impact - JUMP);
  if (u < 0) {
    drawLogo(g, t);
    if (t >= T.spin) spinner(g, W / 2, 820, t - T.spin);
    return;
  }
  if (u < 0.26) markAt(g, LIFT * (1 - Math.pow(1 - u / 0.26, 3)));        // shoot up, easing to a stop
  else markAt(g, LIFT * (1 - Math.pow(clamp((u - 0.26) / (JUMP - 0.26)), 2))); // slam down, accelerating
}

// End screen: time and date on the logo blue, coming in the instant the logo lands.
function sceneEnd(g, v) {
  g.fillStyle = BLUE; g.fillRect(0, 0, W, H);
  const k = 1 - Math.pow(1 - clamp(v / 0.45), 3), dy = (1 - k) * 60;
  g.globalAlpha = k;
  // faint grid and a thin rounded frame
  g.strokeStyle = "rgba(255,255,255,0.06)"; g.lineWidth = 1;
  for (let x = 0; x <= W; x += 80) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y <= H; y += 80) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.strokeStyle = "rgba(255,255,255,0.5)"; g.lineWidth = 1.5; g.beginPath(); g.roundRect(30, 30, W - 60, H - 60, 10); g.stroke();
  text(g, "MYTY.TERMINAL // SESSION M-001", 60, 56, 18, WHITE);
  text(g, "RYZEN 9 9900X3D  /  RTX 5090 FE  /  SYS READY", 60, H - 76, 18, "rgba(255,255,255,0.7)");
  text(g, "09:41", W / 2, 330 + dy, 150, WHITE, FONT, "center");
  text(g, "TUESDAY, OCTOBER 6", W / 2, 505 + dy * 1.3, 32, WHITE, FONT2, "center");
  icon(g, "wifi", W - 230, H - 82, 4); icon(g, "battery", W - 150, H - 78, 4);
  g.globalAlpha = 1;
}

// ---- master render --------------------------------------------------------
function renderAt(t) {
  const g = ctx;
  g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
  if (t < T.term) sceneBlack(g);
  else if (t < T.termEnd) sceneTerminal(g, t - T.term);
  else if (t < T.blue) sceneBlack(g);
  else if (t < T.impact) sceneBlue(g, t);
  else sceneEnd(g, t - T.impact);
}

window.BOOT = { W, H, FPS, DURATION, renderAt, ready: Promise.all([logoReady, document.fonts.load(`28px "${FONT}"`), document.fonts.load(`28px "${FONT2}"`)]) };

// live preview: plays in real time when opened in a browser (?still disables it)
if (!location.search.includes("still")) BOOT.ready.then(() => {
  const t0 = performance.now();
  const loop = () => { renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  loop();
});
</script>
</body>
</html>
